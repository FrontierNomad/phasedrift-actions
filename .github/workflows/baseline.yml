name: PhaseDrift merged-code baseline
on:
  workflow_call:
    inputs:
      source-id:
        required: true
        type: string
      runner-labels:
        description: JSON labels for an explicitly approved runner; never infer free hosted minutes.
        required: false
        default: '["self-hosted","phasedrift-baseline"]'
        type: string
      exercise-lost-ack:
        description: Replay acknowledged bytes for a targeted recovery integration test.
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write
jobs:
  baseline:
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 15
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download pinned PhaseDrift collector
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}/${RUNNER_ARCH}" in
            Linux/X64) archive='phasedrift-baseline/0.4.46/linux-x64/phasedrift-baseline-0.4.46-linux-x64.tar.gz'; expected='25b3705aeeba8d1a5e5ede3f916810dd97936fd2d31fc482d10a896a9455a444' ;;
            macOS/ARM64) archive='phasedrift-baseline/0.4.46/darwin-arm64/phasedrift-baseline-0.4.46-darwin-arm64.tar.gz'; expected='049a9f7578fb1743f58890409c0d6644cb9d8bfd96ded01741dd5a1efb99d492' ;;
            *) echo 'No reviewed collector build for this runner.' >&2; exit 1 ;;
          esac
          root="$(mktemp -d "${RUNNER_TEMP}/phasedrift-baseline.XXXXXXXX")"
          printf 'PHASEDRIFT_CI_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "https://downloads.phasedrift.ai/$archive" -o "$root/collector.tar.gz"
          if command -v shasum >/dev/null; then actual="$(shasum -a 256 "$root/collector.tar.gz" | cut -d ' ' -f 1)"; else actual="$(sha256sum "$root/collector.tar.gz" | cut -d ' ' -f 1)"; fi
          test "$actual" = "$expected"
          tar -xzf "$root/collector.tar.gz" -C "$root"
          collector_root="$root/$(basename "$archive" .tar.gz)"
          cat "$collector_root/BUILD.json"
          printf '\n'
          collector_bun="$(BUN_BE_BUN=1 "$collector_root/phasedrift-app" --version)"
          analyzer_bun="$(BUN_BE_BUN=1 "$collector_root/runtime" --version)"
          test "$collector_bun" = '1.4.3'
          test "$analyzer_bun" = '1.4.3'
          printf 'Verified collector and analyzer runtime: Bun %s\n' "$collector_bun"
          printf 'PHASEDRIFT_CI_BIN=%s\n' "$collector_root/phasedrift-app" >> "$GITHUB_ENV"
          command -v git >/dev/null
          command -v node >/dev/null
          command -v perl >/dev/null
      - name: Measure and acknowledge compact results
        shell: bash
        env:
          PHASEDRIFT_SOURCE_ID: ${{ inputs.source-id }}
        run: |
          set -euo pipefail
          collector="$PHASEDRIFT_CI_BIN"
          "$collector" --repo "$GITHUB_WORKSPACE" --source "$PHASEDRIFT_SOURCE_ID" --state-dir "$PHASEDRIFT_CI_ROOT/evidence" --profile structural
      - name: Exercise lost-ACK recovery without rescanning
        if: inputs.exercise-lost-ack
        shell: bash
        env:
          PHASEDRIFT_SOURCE_ID: ${{ inputs.source-id }}
        run: |
          set -euo pipefail
          "$PHASEDRIFT_CI_BIN" --repo "$GITHUB_WORKSPACE" --source "$PHASEDRIFT_SOURCE_ID" --state-dir "$PHASEDRIFT_CI_ROOT/evidence" --profile structural --resume-upload
      - name: Retain compact frozen upload after failure
        if: failure() && env.PHASEDRIFT_CI_ROOT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phasedrift-upload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PHASEDRIFT_CI_ROOT }}/evidence/upload.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Remove temporary source-independent reports
        if: always()
        shell: bash
        run: |
          if [[ -n "${PHASEDRIFT_CI_ROOT:-}" && "$PHASEDRIFT_CI_ROOT" == "$RUNNER_TEMP"/phasedrift-baseline.* ]]; then
            rm -rf -- "$PHASEDRIFT_CI_ROOT"
          fi
